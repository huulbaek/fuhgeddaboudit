services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://mnemosyne:${POSTGRES_PASSWORD}@db:5432/mnemosyne
      JWT_SECRET: ${JWT_SECRET}
      NUXT_PUBLIC_SCREENING_ENABLED: ${NUXT_PUBLIC_SCREENING_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.3-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: mnemosyne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mnemosyne
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'mnemosyne', '-d', 'mnemosyne']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
